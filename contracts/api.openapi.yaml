openapi: 3.1.0
info:
  title: 知择 API
  version: 0.9.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: 后端健康检查
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: zhize-api }
  /api/v1/search:
    post:
      summary: 创建搜索任务
      description: 搜索结果由配置的 AI 引擎提供；后端不会自行生成搜索结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "202":
          description: 搜索任务已接受
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchAccepted"
        "422":
          description: 请求格式无效
  /api/v1/search/{task_id}:
    get:
      summary: 获取搜索任务状态和结果
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 任务状态、结果或错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchTask"
        "404":
          description: 搜索任务不存在
components:
  schemas:
    SearchRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 4000 }
        candidate_limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: 候选采集预算，与结果分页大小分离。
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
          deprecated: true
          description: 兼容旧客户端的字段，不再限制候选采集或结果分页。
    SearchAccepted:
      type: object
      required: [task_id, status]
      properties:
        task_id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, completed, partial, failed]
    SearchTask:
      type: object
      required:
        - task_id
        - query
        - status
        - results
        - stages
        - total_results
        - page
        - page_size
        - errors
        - agent_runs
        - answer
        - answer_claims
        - research
        - research_rounds
        - tool_calls
        - search_metrics
      properties:
        task_id: { type: string, format: uuid }
        query: { type: string }
        status:
          type: string
          enum: [queued, running, completed, partial, failed]
        results:
          type: array
          items: { $ref: "#/components/schemas/ResultCard" }
        stages:
          type: array
          items: { $ref: "#/components/schemas/StageProgress" }
        total_results: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100, default: 10 }
        errors:
          type: array
          items: { type: string }
        error: { type: string }
        agent_runs:
          type: array
          items: { $ref: "#/components/schemas/AgentRun" }
        answer: { type: [string, "null"] }
        answer_claims:
          type: array
          items: { $ref: "#/components/schemas/AnswerClaim" }
        research:
          oneOf:
            - { type: "null" }
            - $ref: "#/components/schemas/ResearchOutcome"
        research_rounds:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ResearchRound" }
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ResearchToolCall" }
        search_metrics:
          type: array
          items: { $ref: "#/components/schemas/SearchProviderMetric" }
    StageProgress:
      type: object
      required:
        - key
        - status
        - started_at
        - completed_at
        - duration_ms
        - input_count
        - output_count
        - verified_count
        - unverified_count
        - conflict_count
        - error
      properties:
        key:
          type: string
          enum: [collect, clean, verify, judge]
        status:
          type: string
          enum: [pending, running, completed, partial, failed, skipped]
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        input_count: { type: [integer, "null"], minimum: 0 }
        output_count: { type: [integer, "null"], minimum: 0 }
        verified_count: { type: [integer, "null"], minimum: 0 }
        unverified_count: { type: [integer, "null"], minimum: 0 }
        conflict_count: { type: [integer, "null"], minimum: 0 }
        error: { type: [string, "null"] }
    ResultCard:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - category
        - summary
        - rank
        - recommendation_reason
        - attributes
        - source_url
        - source_name
        - additional_sources
        - published_at
        - last_verified_at
        - verification_status
        - matching_status
        - freshness_status
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        category:
          type: string
          enum: [dining, employment, procurement, product, travel, policy, other]
        summary: { type: string }
        rank: { type: integer, minimum: 1 }
        recommendation_reason: { type: string }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ResultCardAttribute" }
        source_url: { type: [string, "null"], format: uri }
        source_name: { type: [string, "null"] }
        additional_sources:
          type: array
          items: { $ref: "#/components/schemas/ResultCardSource" }
        published_at: { type: [string, "null"] }
        last_verified_at: { type: [string, "null"] }
        verification_status:
          type: string
          enum: [verified, pending, conflict, unknown]
        matching_status:
          type: string
          enum: [recommended, needs_verification, not_matched, unknown]
        freshness_status:
          type: string
          enum: [fresh, stale, unknown]
    ResultCardAttribute:
      type: object
      additionalProperties: false
      required: [key, label, value, status, evidence_url, evidence_quote]
      properties:
        key: { type: string, minLength: 1, maxLength: 120 }
        label: { type: string, minLength: 1, maxLength: 120 }
        value: { type: [string, "null"] }
        status:
          type: string
          enum: [verified, pending, unknown, conflict]
        evidence_url: { type: [string, "null"], format: uri }
        evidence_quote: { type: [string, "null"] }
    ResultCardSource:
      type: object
      additionalProperties: false
      required: [url, name, type, status]
      properties:
        url: { type: string, minLength: 1, format: uri }
        name: { type: string, minLength: 1 }
        type:
          type: string
          enum: [official, third_party, unknown]
        status:
          type: string
          enum: [verified, pending, unknown, conflict]
    AgentRun:
      type: object
      required: [agent, action, status, started_at, completed_at, duration_ms, latency_ms, model, request_id, prompt_tokens, completion_tokens, total_tokens, estimated_cost_usd, input_summary, output_summary, error_code]
      properties:
        agent: { type: string, enum: [collect, clean, verify, judge] }
        action: { type: string, enum: [intent_understanding, search, extraction, source_verification, semantic_match, final_answer] }
        status: { type: string, enum: [pending, running, completed, partial, skipped_unconfigured, skipped_no_evidence, failed] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        latency_ms: { type: [integer, "null"], minimum: 0 }
        model: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        prompt_tokens: { type: [integer, "null"], minimum: 0 }
        completion_tokens: { type: [integer, "null"], minimum: 0 }
        total_tokens: { type: [integer, "null"], minimum: 0 }
        estimated_cost_usd: { type: [number, "null"], minimum: 0 }
        input_summary: { type: [string, "null"] }
        output_summary: { type: [string, "null"] }
        error_code: { type: [string, "null"] }
    SearchResult:
      type: object
      required:
        - id
        - title
        - url
        - source_name
        - snippet
        - evidence
        - match_reason
        - verdict
        - confidence
        - verified_fields
        - unverified_fields
        - deadline_status
        - official_source_status
        - evidence_status
        - procurement_category
        - match_status
        - match_score
        - decision
        - summary
        - key_conditions
        - evidence_sources
        - evidence_detail
        - application_url
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        url: { type: string, minLength: 1, format: uri }
        source_name: { type: string, minLength: 1 }
        snippet: { type: string }
        evidence: { type: string }
        match_reason: { type: string }
        verdict:
          type: string
          enum: [supports, contradicts, context, unverified]
        confidence: { type: number, minimum: 0, maximum: 1 }
        published_at: { type: [string, "null"] }
        official_source_url: { type: [string, "null"], format: uri }
        verified_fields:
          type: array
          items:
            type: string
            enum:
              - project_name
              - purchasing_unit
              - published_at
              - budget
              - deadline
              - evidence
              - graduate_cohort
              - major
              - open_status
              - application_url
              - role
              - organization
              - qualifications
              - business_attributes
              - region
        unverified_fields:
          type: array
          items:
            type: string
            enum:
              - project_name
              - purchasing_unit
              - published_at
              - budget
              - deadline
              - evidence
              - graduate_cohort
              - major
              - open_status
              - application_url
              - role
              - organization
              - qualifications
              - business_attributes
              - region
        purchasing_unit: { type: [string, "null"] }
        budget: { type: [string, "null"] }
        deadline_at: { type: [string, "null"] }
        deadline_status:
          type: string
          enum: [expired, not_expired, not_stated, unverified]
        official_source_status:
          type: string
          enum: [verified, third_party, insufficient_evidence, unverified]
        evidence_status:
          type: string
          enum: [available, missing]
        procurement_category:
          type: string
          enum: [ai_training, ai_system, digital_transformation, compute_hardware, other, unclear]
        match_status:
          type: string
          enum: [matched, partial, keyword_only, not_matched, unverified]
        match_score: { type: number, minimum: 0, maximum: 1 }
        mismatch_reason: { type: [string, "null"] }
        decision:
          type: string
          enum: [recommended, needs_verification, not_matched]
        result_kind:
          type: [string, "null"]
          enum: [specific_opportunity, organization_lead, unknown, null]
        summary: { type: string }
        key_conditions:
          type: array
          items: { $ref: "#/components/schemas/KeyCondition" }
        evidence_sources:
          type: array
          items: { $ref: "#/components/schemas/EvidenceSource" }
        evidence_detail: { type: string }
        application_url: { type: [string, "null"], format: uri }
        llm_verification:
          oneOf:
            - { type: "null" }
            - $ref: "#/components/schemas/LLMVerification"
        llm_semantic_match:
          oneOf:
            - { type: "null" }
            - $ref: "#/components/schemas/LLMSemanticMatch"
    LLMVerificationFact:
      type: object
      required: [field, value, assessment, evidence_url, quote]
      properties:
        field: { type: string }
        value: { type: string }
        assessment: { type: string, enum: [supports, contradicts, context, uncertain] }
        evidence_url: { type: [string, "null"], format: uri }
        quote: { type: [string, "null"] }
    LLMVerification:
      type: object
      required: [status, facts]
      properties:
        status: { type: string, enum: [analyzed, rejected, not_analyzed] }
        facts:
          type: array
          items: { $ref: "#/components/schemas/LLMVerificationFact" }
    LLMSemanticMatch:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [analyzed, rejected, not_analyzed] }
        fit: { type: [string, "null"], enum: [strong, partial, weak, uncertain, null] }
        score: { type: [number, "null"], minimum: 0, maximum: 1 }
        reason: { type: [string, "null"] }
        evidence_quotes:
          type: array
          items: { type: string }
    AnswerClaim:
      type: object
      required: [result_id, text, evidence_quotes, sources]
      properties:
        result_id: { type: string }
        text: { type: string }
        evidence_quotes:
          type: array
          items: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/EvidenceSource" }
    ResearchOutcome:
      type: object
      required: [status, rounds, tool_calls, providers, model_calls, total_tokens, elapsed_ms, stop_reason, partial_results]
      properties:
        status: { type: string, enum: [completed, partial, stopped, failed] }
        rounds:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ResearchRound" }
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ResearchToolCall" }
        providers:
          type: array
          items: { $ref: "#/components/schemas/SearchProviderMetric" }
        model_calls: { type: integer, minimum: 0 }
        total_tokens: { type: [integer, "null"], minimum: 0 }
        elapsed_ms: { type: integer, minimum: 0 }
        stop_reason: { type: string }
        partial_results: { type: boolean }
    ResearchRound:
      type: object
      required: [round_number, status, reason, planned_queries, search_requests, sources_found, new_sources, candidates_before, candidates_after, evidence_gaps, duration_ms]
      properties:
        round_number: { type: integer, minimum: 1, maximum: 3 }
        status: { type: string, enum: [planned, running, completed, partial, stopped, failed] }
        reason: { type: string }
        planned_queries: { type: array, maxItems: 12, items: { type: string } }
        search_requests: { type: integer, minimum: 0 }
        sources_found: { type: integer, minimum: 0 }
        new_sources: { type: integer, minimum: 0 }
        candidates_before: { type: integer, minimum: 0 }
        candidates_after: { type: integer, minimum: 0 }
        evidence_gaps: { type: array, maxItems: 20, items: { type: string } }
        duration_ms: { type: [integer, "null"], minimum: 0 }
    ResearchToolCall:
      type: object
      required: [round_number, name, status, input_summary, output_summary, provider, source_count, duration_ms, error_code, model, request_id, prompt_tokens, completion_tokens, total_tokens]
      properties:
        round_number: { type: integer, minimum: 1 }
        name: { type: string, enum: [search_web, search_official, read_webpage, inspect_evidence] }
        status: { type: string, enum: [running, completed, partial, rejected, failed] }
        input_summary: { type: string }
        output_summary: { type: string }
        provider: { type: [string, "null"] }
        source_count: { type: [integer, "null"], minimum: 0 }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        error_code: { type: [string, "null"] }
        model: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        prompt_tokens: { type: [integer, "null"], minimum: 0 }
        completion_tokens: { type: [integer, "null"], minimum: 0 }
        total_tokens: { type: [integer, "null"], minimum: 0 }
    SearchProviderMetric:
      type: object
      required: [provider, configured, requests, returned_sources, failures, latency_ms, error_code]
      properties:
        provider: { type: string }
        configured: { type: boolean }
        requests: { type: integer, minimum: 0 }
        returned_sources: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0 }
        latency_ms: { type: integer, minimum: 0 }
        error_code: { type: [string, "null"] }
    KeyCondition:
      type: object
      required: [label, value, status]
      properties:
        label: { type: string }
        value: { type: string }
        status:
          type: string
          enum: [verified, unverified, conflict, missing]
        evidence_url: { type: [string, "null"], format: uri }
        quote: { type: [string, "null"] }
    EvidenceSource:
      type: object
      required: [title, url, source_type, status]
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        source_type:
          type: string
          enum: [official, third_party, unknown]
        status:
          type: string
          enum: [verified, unverified, conflict]
