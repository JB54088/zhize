openapi: 3.1.0
info:
  title: 知择 API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: 后端健康检查
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: zhize-api }
  /api/v1/search:
    post:
      summary: 创建搜索任务
      description: 搜索结果由配置的 AI 引擎提供；后端不会自行生成搜索结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "202":
          description: 搜索任务已接受
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchAccepted"
        "422":
          description: 请求格式无效
  /api/v1/search/{task_id}:
    get:
      summary: 获取搜索任务状态和结果
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 任务状态、结果或错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchTask"
        "404":
          description: 搜索任务不存在
components:
  schemas:
    SearchRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 4000 }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
    SearchAccepted:
      type: object
      required: [task_id, status]
      properties:
        task_id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, completed, failed]
    SearchTask:
      type: object
      required: [task_id, query, status, results]
      properties:
        task_id: { type: string, format: uuid }
        query: { type: string }
        status:
          type: string
          enum: [queued, running, completed, failed]
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        error: { type: string }
    SearchResult:
      type: object
      required:
        - id
        - title
        - url
        - source_name
        - snippet
        - evidence
        - match_reason
        - verdict
        - confidence
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        url: { type: string, minLength: 1, format: uri }
        source_name: { type: string, minLength: 1 }
        snippet: { type: string }
        evidence: { type: string }
        match_reason: { type: string }
        verdict:
          type: string
          enum: [supports, contradicts, context, unverified]
        confidence: { type: number, minimum: 0, maximum: 1 }
        published_at: { type: [string, "null"], format: date-time }
