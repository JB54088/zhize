openapi: 3.1.0
info:
  title: 知择 AI 搜索与信息核验引擎
  version: 0.1.0
  description: >-
    通过配置的真实搜索服务检索来源，并基于返回正文提取证据与核验标签。
    未配置搜索服务时返回 503；服务不会回退到演示数据或生成搜索结果。
servers:
  - url: http://127.0.0.1:8001
paths:
  /health:
    get:
      summary: AI 引擎健康检查
      responses:
        "200":
          description: 服务进程正常
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: zhize-ai-engine }
  /api/v1/search:
    post:
      summary: 搜索真实来源并提取可核验证据
      description: >-
        仅返回已配置搜索提供方返回的来源。没有搜索配置时返回 503，
        不生成或使用模拟搜索结果。LLM 可选，且只能标注已有来源 ID 和原文证据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: 搜索来源及其来源正文中的证据和匹配判断
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          description: 请求格式无效
        "503":
          description: 搜索提供方未配置或不受支持，或 LLM 配置不完整
        "502":
          description: 搜索提供方或已配置的大模型返回错误
components:
  schemas:
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
    SearchResult:
      type: object
      required:
        - id
        - title
        - url
        - source_name
        - snippet
        - evidence
        - match_reason
        - verdict
        - confidence
        - deadline_status
        - official_source_status
        - evidence_status
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        url: { type: string, minLength: 1, format: uri }
        source_name: { type: string, minLength: 1 }
        snippet: { type: string }
        evidence:
          type: string
          description: 搜索提供方返回正文中的原文片段；没有正文时为空字符串。
        match_reason:
          type: string
          description: 基于查询与来源文本的可解释匹配理由。
        verdict:
          type: string
          enum: [supports, contradicts, context, unverified]
        confidence: { type: number, minimum: 0, maximum: 1 }
        published_at: { type: [string, "null"] }
        deadline_status:
          type: string
          enum: [expired, not_expired, not_stated, unverified]
          description: >-
            已截止只在来源正文同时包含明确截止提示和邻近可解析日期时标记；
            日期无法核实时为 unverified。
        official_source_status:
          type: string
          enum: [verified, unverified]
          description: 仅政府域名或 OFFICIAL_SOURCE_DOMAINS 配置的域名标记为 verified。
        evidence_status:
          type: string
          enum: [available, missing]
          description: 来源正文有可引用证据时为 available，否则为 missing。
    SearchResponse:
      type: object
      required: [query, results]
      properties:
        query: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
