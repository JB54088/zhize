openapi: 3.1.0
info:
  title: 知择 AI 搜索与信息核验引擎
  version: 0.3.0
  description: >-
    使用可配置的 OpenAI 兼容大模型协助四 Agent 流程。真实来源检索、逐字证据核验和硬性条件最终裁决由确定性规则约束。
    未配置 LLM 时运行仍可使用确定性处理，并在 agent_runs 标记 skipped_unconfigured；不会伪造搜索来源或模型调用。
servers:
  - url: http://127.0.0.1:8001
paths:
  /health:
    get:
      summary: AI 引擎健康检查
      responses:
        "200":
          description: 服务进程正常
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: zhize-ai-engine }
  /api/v1/search:
    post:
      summary: 搜索真实来源并提取可核验证据
      description: >-
        仅返回已配置搜索提供方返回的来源。没有搜索配置时返回 503，
        不生成或使用模拟搜索结果。LLM 分析只能引用已有来源和逐字证据，且不能覆盖硬条件裁决。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: 搜索来源及其来源正文中的证据和匹配判断
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          description: 请求格式无效
        "503":
          description: 搜索提供方未配置或不受支持，或 LLM 配置不完整
        "502":
          description: 搜索提供方或已配置的大模型返回错误
  /api/v1/search/stream:
    post:
      summary: 按阶段输出搜索与信息决策进度（NDJSON）
      description: >-
        每行一个 JSON 对象。事件包括阶段快照和 agent/action 执行记录，最后为 complete；失败阶段会附带 error 事件。
        小采内可并行调用多路真实搜索，清洗、核验、判断依赖前一阶段完成后顺序运行。
        running 事件不含虚构计数或进度百分比。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: 逐行 NDJSON 搜索阶段与最终结果事件
          content:
            application/x-ndjson:
              schema:
                type: string
                description: 每行一个 StageEvent、AgentEvent、CompleteEvent 或 ErrorEvent JSON 对象
              examples:
                stage:
                  value: '{"type":"stage","stage":{"key":"collect","status":"completed","started_at":"2026-10-08T10:00:00Z","completed_at":"2026-10-08T10:00:01Z","duration_ms":1000,"input_count":1,"output_count":8,"verified_count":null,"unverified_count":null,"conflict_count":null,"error":null}}'
                complete:
                  value: '{"type":"complete","query":"校招公司","results":[],"errors":[]}'
                agent:
                  value: '{"type":"agent","run":{"agent":"collect","action":"intent_understanding","status":"completed","started_at":"2026-10-08T10:00:00Z","completed_at":"2026-10-08T10:00:01Z","duration_ms":850,"model":"deepseek-flash","request_id":"opaque-provider-id","prompt_tokens":120,"completion_tokens":50,"total_tokens":170,"estimated_cost_usd":null,"input_summary":"query_length=20","output_summary":"domain=employment; hard_conditions=2","error_code":null}}'
        "422":
          description: 请求格式无效
        "503":
          description: 搜索提供方未配置或不受支持
        "502":
          description: 搜索流水线执行失败
components:
  schemas:
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
        candidate_limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: 搜索与清洗候选池上限；独立于 UI 的分页大小，截断只发生在来源标准化之后。
        limit:
          type: [integer, "null"]
          minimum: 1
          maximum: 20
          deprecated: true
          description: 兼容旧客户端的字段；不控制候选采集或展示分页。
    SearchResult:
      type: object
      required:
        - id
        - title
        - url
        - source_name
        - snippet
        - evidence
        - match_reason
        - verdict
        - confidence
        - verified_fields
        - unverified_fields
        - deadline_status
        - official_source_status
        - evidence_status
        - procurement_category
        - match_status
        - match_score
        - decision
        - summary
        - key_conditions
        - evidence_sources
        - evidence_detail
        - application_url
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        url: { type: string, minLength: 1, format: uri }
        source_name: { type: string, minLength: 1 }
        snippet: { type: string }
        evidence:
          type: string
          description: 搜索提供方返回正文中的原文片段；没有正文时为空字符串。
        match_reason:
          type: string
          description: 基于查询与来源文本的可解释匹配理由。
        verdict:
          type: string
          enum: [supports, contradicts, context, unverified]
        confidence: { type: number, minimum: 0, maximum: 1 }
        published_at: { type: [string, "null"] }
        official_source_url: { type: [string, "null"], format: uri }
        verified_fields:
          type: array
          items:
            type: string
            enum: [project_name, purchasing_unit, published_at, budget, deadline, evidence, graduate_cohort, major, open_status, application_url, role, organization, qualifications, business_attributes, region]
        unverified_fields:
          type: array
          items:
            type: string
            enum: [project_name, purchasing_unit, published_at, budget, deadline, evidence, graduate_cohort, major, open_status, application_url, role, organization, qualifications, business_attributes, region]
        purchasing_unit: { type: [string, "null"] }
        budget: { type: [string, "null"] }
        deadline_at: { type: [string, "null"] }
        deadline_status:
          type: string
          enum: [expired, not_expired, not_stated, unverified]
          description: >-
            已截止只在来源正文同时包含明确截止提示和邻近可解析日期时标记；
            日期无法核实时为 unverified。
        official_source_status:
          type: string
          enum: [verified, third_party, insufficient_evidence, unverified]
          description: verified 需匹配官方采购公告正文与项目；域名本身不代表字段都已核实；unverified 仅用于兼容旧任务。
        evidence_status:
          type: string
          enum: [available, missing]
          description: 来源正文有可引用证据时为 available，否则为 missing。
        procurement_category:
          type: string
          enum: [ai_training, ai_system, digital_transformation, compute_hardware, other, unclear]
        match_status:
          type: string
          enum: [matched, partial, keyword_only, not_matched, unverified]
        match_score: { type: number, minimum: 0, maximum: 1 }
        mismatch_reason: { type: [string, "null"] }
        decision:
          type: string
          enum: [recommended, needs_verification, not_matched]
        result_kind:
          type: string
          enum: [specific_opportunity, organization_lead, unknown]
          description: 未核验硬条件不会被视为满足。
        summary: { type: string }
        key_conditions:
          type: array
          items: { $ref: "#/components/schemas/KeyCondition" }
        evidence_sources:
          type: array
          items: { $ref: "#/components/schemas/EvidenceSource" }
        evidence_detail:
          type: string
          description: 可展开的原始来源正文；界面不应默认展示长文本。
        application_url:
          type: [string, "null"]
          format: uri
          description: 仅当匹配职位的官方原文明确给出并核验投递链接时返回；不会回退到搜索结果 URL。
        llm_verification:
          oneOf:
            - { type: "null" }
            - $ref: "#/components/schemas/LLMVerification"
          description: 仅对已逐字核实的官方来源做辅助理解，不替代 verified_fields。
        llm_semantic_match:
          oneOf:
            - { type: "null" }
            - $ref: "#/components/schemas/LLMSemanticMatch"
          description: 模型语义匹配解释；不会覆盖硬条件规则结论或 match_score。
    SourceRecord:
      type: object
      required: [id, title, url, source_name, provider, captured_at, published_at, search_query_index, search_query, raw_text, raw_text_truncated, metadata]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 1000 }
        url: { type: string, minLength: 1, maxLength: 2048, format: uri }
        source_name: { type: [string, "null"], maxLength: 240 }
        provider: { type: [string, "null"], maxLength: 80 }
        captured_at: { type: [string, "null"], maxLength: 80 }
        published_at: { type: [string, "null"], maxLength: 120 }
        search_query_index: { type: [integer, "null"], minimum: 0 }
        search_query: { type: [string, "null"], maxLength: 4000 }
        raw_text: { type: string, maxLength: 12000 }
        raw_text_truncated: { type: boolean }
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: [string, integer, number, boolean, "null"]
    ResultCard:
      type: object
      required:
        - id
        - title
        - category
        - summary
        - rank
        - recommendation_reason
        - attributes
        - source_url
        - source_name
        - additional_sources
        - published_at
        - last_verified_at
        - verification_status
        - matching_status
        - freshness_status
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        category:
          type: string
          enum: [dining, employment, procurement, product, travel, policy, other]
        summary: { type: string }
        rank: { type: integer, minimum: 1 }
        recommendation_reason: { type: string }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ResultCardAttribute" }
        source_url: { type: [string, "null"], format: uri }
        source_name: { type: [string, "null"] }
        additional_sources:
          type: array
          items: { $ref: "#/components/schemas/ResultCardSource" }
        published_at: { type: [string, "null"] }
        last_verified_at: { type: [string, "null"] }
        verification_status:
          type: string
          enum: [verified, pending, conflict, unknown]
        matching_status:
          type: string
          enum: [recommended, needs_verification, not_matched, unknown]
        freshness_status:
          type: string
          enum: [fresh, stale, unknown]
    ResultCardAttribute:
      type: object
      required: [key, label, value, status, evidence_url, evidence_quote]
      properties:
        key: { type: string, minLength: 1, maxLength: 120 }
        label: { type: string, minLength: 1, maxLength: 120 }
        value: { type: [string, "null"] }
        status: { type: string, enum: [verified, pending, unknown, conflict] }
        evidence_url: { type: [string, "null"], format: uri }
        evidence_quote: { type: [string, "null"] }
    ResultCardSource:
      type: object
      required: [url, name, type, status]
      properties:
        url: { type: string, minLength: 1, format: uri }
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [official, third_party, unknown] }
        status: { type: string, enum: [verified, pending, unknown, conflict] }
    KeyCondition:
      type: object
      required: [label, value, status, evidence_url, quote]
      properties:
        label: { type: string }
        value: { type: string }
        status: { type: string, enum: [verified, unverified, conflict, missing] }
        evidence_url: { type: [string, "null"], format: uri }
        quote: { type: [string, "null"] }
    EvidenceSource:
      type: object
      required: [title, url, source_type, status]
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        source_type: { type: string, enum: [official, third_party, unknown] }
        status: { type: string, enum: [verified, unverified, conflict] }
    StageSnapshot:
      type: object
      required: [key, status, started_at, completed_at, duration_ms, input_count, output_count, verified_count, unverified_count, conflict_count, error]
      properties:
        key: { type: string, enum: [collect, clean, verify, judge] }
        status: { type: string, enum: [pending, running, completed, partial, failed, skipped] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        input_count: { type: [integer, "null"], minimum: 0 }
        output_count: { type: [integer, "null"], minimum: 0 }
        verified_count: { type: [integer, "null"], minimum: 0 }
        unverified_count: { type: [integer, "null"], minimum: 0 }
        conflict_count: { type: [integer, "null"], minimum: 0 }
        error: { type: [string, "null"] }
    AgentRun:
      type: object
      required: [agent, action, status, started_at, completed_at, duration_ms, latency_ms, model, request_id, prompt_tokens, completion_tokens, total_tokens, estimated_cost_usd, input_summary, output_summary, error_code]
      properties:
        agent: { type: string, enum: [collect, clean, verify, judge] }
        action: { type: string, enum: [intent_understanding, search, extraction, source_verification, semantic_match, final_answer] }
        status: { type: string, enum: [pending, running, completed, partial, skipped_unconfigured, skipped_no_evidence, failed] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        latency_ms: { type: [integer, "null"], minimum: 0, description: LLM 客户端报告的请求耗时；非模型动作为空 }
        model: { type: [string, "null"] , description: 实际响应模型名；未发起模型请求时为空 }
        request_id: { type: [string, "null"], description: 提供方实际返回的调用 ID }
        prompt_tokens: { type: [integer, "null"], minimum: 0 }
        completion_tokens: { type: [integer, "null"], minimum: 0 }
        total_tokens: { type: [integer, "null"], minimum: 0 }
        estimated_cost_usd: { type: [number, "null"], minimum: 0, description: 只有显式配置费率时才估算 }
        input_summary: { type: string, description: 不含原始提示词或密钥的摘要 }
        output_summary: { type: string, description: 不含完整模型原文的摘要 }
        error_code: { type: [string, "null"] }
    ModelVerifiedFact:
      type: object
      required: [field, value, assessment, evidence_url, quote]
      properties:
        field: { type: string, enum: [project_name, purchasing_unit, published_at, budget, deadline, evidence, graduate_cohort, major, open_status, application_url, role, organization, qualifications, business_attributes, region] }
        value: { type: string }
        assessment: { type: string, enum: [supports, contradicts, context, uncertain] }
        evidence_url: { type: [string, "null"], format: uri }
        quote: { type: [string, "null"] }
    LLMVerification:
      type: object
      required: [status, facts]
      properties:
        status: { type: string, enum: [analyzed, rejected, not_analyzed] }
        facts:
          type: array
          items: { $ref: "#/components/schemas/ModelVerifiedFact" }
    LLMSemanticMatch:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [analyzed, rejected, not_analyzed] }
        fit: { type: string, enum: [strong, partial, weak, uncertain] }
        score: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string }
        evidence_quotes:
          type: array
          items: { type: string }
    AnswerClaim:
      type: object
      required: [result_id, text, evidence_quotes]
      properties:
        result_id: { type: string }
        text: { type: string }
        evidence_quotes:
          type: array
          items: { type: string }
    SearchStreamEvent:
      oneOf:
        - type: object
          required: [type, stage]
          properties:
            type: { type: string, const: stage }
            stage: { $ref: "#/components/schemas/StageSnapshot" }
        - type: object
          required: [type, run]
          properties:
            type: { type: string, const: agent }
            run: { $ref: "#/components/schemas/AgentRun" }
        - type: object
          required: [type, results]
          properties:
            type: { type: string, const: partial_results }
            results:
              type: array
              items: { $ref: "#/components/schemas/SearchResult" }
        - type: object
          required: [type, round]
          properties:
            type: { type: string, const: research_round }
            round: { $ref: "#/components/schemas/ResearchRound" }
        - type: object
          required: [type, call]
          properties:
            type: { type: string, const: tool_call }
            call: { $ref: "#/components/schemas/ResearchToolCall" }
        - type: object
          required: [type, query, results, cards, source_records, answer, answer_claims, agent_runs, errors, research, search_metrics]
          properties:
            type: { type: string, const: complete }
            query: { type: string }
            answer: { type: string }
            answer_claims:
              type: array
              items: { $ref: "#/components/schemas/AnswerClaim" }
            results:
              type: array
              items: { $ref: "#/components/schemas/SearchResult" }
            cards:
              type: array
              items: { $ref: "#/components/schemas/ResultCard" }
            source_records:
              type: array
              maxItems: 500
              description: 仅供本地 API 持久化的受控采集归档；不应转发给公开客户端。
              items: { $ref: "#/components/schemas/SourceRecord" }
            agent_runs:
              type: array
              items: { $ref: "#/components/schemas/AgentRun" }
            errors:
              type: array
              items: { type: string }
            research:
              oneOf:
                - { type: "null" }
                - $ref: "#/components/schemas/ResearchOutcome"
            search_metrics:
              type: array
              items: { $ref: "#/components/schemas/SearchProviderMetric" }
        - type: object
          required: [type, stage, message]
          properties:
            type: { type: string, const: error }
            stage: { type: string }
            message: { type: string }
    SearchResponse:
      type: object
      required: [query, results, cards, source_records, answer, answer_claims, agent_runs, errors, research, search_metrics]
      properties:
        query: { type: string }
        answer: { type: string }
        answer_claims:
          type: array
          items: { $ref: "#/components/schemas/AnswerClaim" }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        cards:
          type: array
          description: 面向通用 C 端结果展示的规范化卡片；results 保留为旧版兼容结构。
          items: { $ref: "#/components/schemas/ResultCard" }
        source_records:
          type: array
          maxItems: 500
          description: 仅供本地 API 持久化的受控采集归档；不应转发给公开客户端。
          items: { $ref: "#/components/schemas/SourceRecord" }
        agent_runs:
          type: array
          items: { $ref: "#/components/schemas/AgentRun" }
        errors:
          type: array
          items: { type: string }
        research:
          oneOf:
            - { type: "null" }
            - $ref: "#/components/schemas/ResearchOutcome"
        search_metrics:
          type: array
          items: { $ref: "#/components/schemas/SearchProviderMetric" }
    ResearchOutcome:
      type: object
      required: [status, rounds, tool_calls, providers, model_calls, total_tokens, elapsed_ms, stop_reason, partial_results]
      properties:
        status: { type: string, enum: [completed, partial, stopped, failed] }
        rounds:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ResearchRound" }
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ResearchToolCall" }
        providers:
          type: array
          items: { $ref: "#/components/schemas/SearchProviderMetric" }
        model_calls: { type: integer, minimum: 0 }
        total_tokens: { type: [integer, "null"], minimum: 0 }
        elapsed_ms: { type: integer, minimum: 0 }
        stop_reason: { type: string }
        partial_results: { type: boolean }
    ResearchRound:
      type: object
      required: [round_number, status, reason, planned_queries, search_requests, sources_found, new_sources, candidates_before, candidates_after, evidence_gaps, duration_ms]
      properties:
        round_number: { type: integer, minimum: 1, maximum: 3 }
        status: { type: string, enum: [planned, running, completed, partial, stopped, failed] }
        reason: { type: string }
        planned_queries: { type: array, maxItems: 12, items: { type: string } }
        search_requests: { type: integer, minimum: 0 }
        sources_found: { type: integer, minimum: 0 }
        new_sources: { type: integer, minimum: 0 }
        candidates_before: { type: integer, minimum: 0 }
        candidates_after: { type: integer, minimum: 0 }
        evidence_gaps: { type: array, maxItems: 20, items: { type: string } }
        duration_ms: { type: [integer, "null"], minimum: 0 }
    ResearchToolCall:
      type: object
      required: [round_number, name, status, input_summary, output_summary, provider, source_count, duration_ms, error_code, model, request_id, prompt_tokens, completion_tokens, total_tokens]
      properties:
        round_number: { type: integer, minimum: 1 }
        name: { type: string, enum: [search_web, search_official, read_webpage, inspect_evidence] }
        status: { type: string, enum: [running, completed, partial, rejected, failed] }
        input_summary: { type: string }
        output_summary: { type: string }
        provider: { type: [string, "null"] }
        source_count: { type: [integer, "null"], minimum: 0 }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        error_code: { type: [string, "null"] }
        model: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        prompt_tokens: { type: [integer, "null"], minimum: 0 }
        completion_tokens: { type: [integer, "null"], minimum: 0 }
        total_tokens: { type: [integer, "null"], minimum: 0 }
    SearchProviderMetric:
      type: object
      required: [provider, configured, requests, returned_sources, failures, latency_ms, error_code]
      properties:
        provider: { type: string }
        configured: { type: boolean }
        requests: { type: integer, minimum: 0 }
        returned_sources: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0 }
        latency_ms: { type: integer, minimum: 0 }
        error_code: { type: [string, "null"] }
